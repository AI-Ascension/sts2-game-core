name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pure core boundary and checked arithmetic
        run: |
          git diff --check
          if grep -REn '\b(unwrap|expect)\b|\b(todo|unimplemented|panic)!' crates/core/src; then exit 1; fi
          grep -En 'checked_|saturating_' crates/core/src/calculators.rs crates/core/src/probability.rs crates/core/src/simulator.rs

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check documentation links
        # A renamed or mistyped deny makes rustdoc emit `unknown lint` as a warning-only
        # diagnostic and still exit 0, so cargo's status alone is not evidence that the
        # lints this step names were accepted. Read the log for the counters as well.
        run: |
          set -o pipefail
          log=target/doc.log
          mkdir -p target
          status=0
          RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links -D rustdoc::redundant_explicit_links --document-private-items" \
            cargo doc --workspace --no-deps --locked 2>&1 | tee "$log" || status=$?
          errors=$(awk '/^error/{count++} END{print count+0}' "$log")
          unknown=$(awk '/unknown lint/{count++} END{print count+0}' "$log")
          warnings=$(awk '/^warning/{count++} END{print count+0}' "$log")
          echo "doc: exit=$status errors=$errors warnings=$warnings unknown_lints=$unknown"
          [ "$status" -eq 0 ] && [ "$errors" -eq 0 ] && [ "$warnings" -eq 0 ] && [ "$unknown" -eq 0 ]

      - name: Run Rust tests
        run: cargo test --workspace --all-targets --all-features --locked
