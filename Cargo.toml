[workspace]
members = ["crates/core", "tools/repo-policy"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace.dependencies]
serde_json = "=1.0.151"
toml = "=1.1.4"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
